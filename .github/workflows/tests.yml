# Plugin test suite, lint, core purity and manifest validation.
#
# WHAT THIS DOES
#   On every pull request and every push to `main`:
#     pytest          the whole pact-plugin suite on ubuntu-latest and macos-latest under
#                     Python 3.9 (the declared floor in pyproject.toml) and 3.14, plus the
#                     ruff import-hygiene lint.
#     core-purity     the shipped purity scanner in public mode.
#     hook-latency    each hook check's p95 on a fixed workload against a committed budget.
#     plugin-validate `claude plugin validate --strict` on the plugin and the marketplace.
#     clean-room      dev/clean-room/run.sh on ubuntu-latest and macos-latest (see CLEAN ROOM).
#   Docs regeneration runs in docs.yml; the needs-import label in labeller.yml.
#
# WHERE PURITY RUNS
#   In the `core-purity` job of THIS file, not in a workflow of its own. Two shipped tests read
#   this file: tests/test_ci_collection_scope.py requires exactly one pytest invocation here,
#   and tests/contract/test_core_purity.py (TestCheckMode) requires the `core-purity` job to
#   run `_purity.py --check`. Moving the job elsewhere fails the second test.
#
# PUBLIC MODE
#   The private name list never ships, so every job sets REPACT_PURITY_NO_DENYLIST=1: the
#   purity gate checks every class except the denylist-driven personal one, and says so.
#   Without it the gate fails closed, which is right everywhere else.
#
# CLEAN ROOM
#   The `clean-room` job runs dev/clean-room/run.sh on ubuntu and macOS without Docker: it installs
#   the plugin from this checkout into a scratch HOME under `env -i` and checks every step of a
#   stranger's first install (validate, purity on the installed copy, init twice, doctor, each hook
#   entry point, each bin/ tool, uninstall). No model call, no login, no network after the CLI
#   install. The same script runs in Docker with `make -C dev/clean-room gate`.
#
# SECRETS
#   None. Every job runs with a read-only token and no repository secrets.

name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    # CHECK NAMES. The job name is built with format() so each cell reports as
    # `pytest (3.9) on ubuntu-latest`, `pytest (3.9) on macos-latest`,
    # `pytest (3.14) on ubuntu-latest` and `pytest (3.14) on macos-latest`.
    # tests/test_ci_collection_scope.py keeps this list equal to the python-version matrix;
    # edit both together. If a status check is ever required, require a stable aggregate
    # name rather than a cell, because each matrix change renames the cells.
    #
    # KNOWN LIMITS FOR THE FIRST RUN
    #   macos-latest is arm64, where setup-python's newest 3.9 build is 3.9.13 (later 3.9
    #   patch releases ship for x64 only). pysqlite3 has no wheels and builds from source,
    #   which needs SQLite headers; on macOS that build is unmeasured.
    #   The 3.9 cells resolve pytest 8.x (9.x needs 3.10+), and older numpy and model2vec,
    #   so a red on 3.9 alone can come from the interpreter, the runner or those libraries.
    name: pytest ${{ format('({0})', matrix.python-version) }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned to a full commit SHA; the comment names the release it resolves to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The embedding model is restored here and saved only after it demonstrably loads (two
      # steps below): an interrupted download leaves a cache that looks warm and cannot load,
      # and an unconditional save would store it under a key claiming completeness. No
      # restore-keys for the same reason. The key hashes embeddings.py, where MODEL_NAME lives.
      - name: Restore the embedding model cache
        id: hf_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pact-plugin/skills/pact-memory/scripts/embeddings.py') }}

      # Each package is needed: httpx and pyyaml are unguarded imports (without them
      # collection errors and nothing runs), pytest-asyncio carries the async cohort,
      # hypothesis makes the property tests run instead of skip. pysqlite3, sqlite-vec and
      # model2vec must equal the `packages` list in skills/pact-memory/scripts/memory_init.py,
      # which refuses to install under CI (tests/test_memory_init.py checks the two agree).
      # ruff is for the lint step only.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest hypothesis httpx pytest-asyncio pyyaml pysqlite3 sqlite-vec model2vec ruff

      # Fetch and load the model here, where no test budget is timing it. MODEL_NAME is read
      # from the source rather than retyped.
      - name: Warm and verify the embedding model
        working-directory: pact-plugin
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "skills/pact-memory")
          from scripts.embeddings import MODEL_NAME
          from model2vec import StaticModel
          print(f"loading {MODEL_NAME}")
          m = StaticModel.from_pretrained(MODEL_NAME, force_download=False)
          v = m.encode(["warm the cache"])
          assert v.shape[0] == 1, v.shape
          print(f"model loaded and encoded, dim={v.shape[1]}")
          PY

      - name: Save the embedding model cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf_cache.outputs.cache-primary-key }}

      # Unused imports and undefined names over all of pact-plugin/, then undefined names on
      # their own so that coverage survives any later narrowing of the first leg. Runs before
      # the suite so a hygiene defect fails in seconds. --target-version py39 is required: the
      # default target misreads the walrus operators in the hooks.
      - name: Import-hygiene lint (F401/F821)
        run: |
          ruff check --select F401,F821 --target-version py39 pact-plugin/
          ruff check --select F821 --target-version py39 pact-plugin/

      # Run from pact-plugin/: tests/conftest.py resolves sys.path and the local `telegram`
      # package from the working directory. No path arguments and no `testpaths` config, on
      # purpose: a bare run collects every test directory, including the ones inside skills/,
      # and tests/test_ci_collection_scope.py fails if this line gains a path. `-ra` lists
      # every non-passing outcome with its reason; never `-rs`, which drops the FAILED lines.
      - name: Run test suite
        working-directory: pact-plugin
        env:
          REPACT_PURITY_NO_DENYLIST: "1"
        run: python -m pytest -ra

  # The purity scanner on its own, under a stable check name. Standard library only, so no
  # install step; `--check`, not pytest, because this file carries exactly one pytest run.
  core-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Core purity (public mode, no denylist)
        working-directory: pact-plugin
        env:
          REPACT_PURITY_NO_DENYLIST: "1"
        run: python tests/contract/_purity.py --check

  # The hook latency budget (tests/perf/hook_latency.py): the dispatcher on a fixed synthetic
  # workload, each check's handler p95 against the committed baseline, normalised by a
  # calibration loop timed in this job, failing only when a budget is missed in two trials.
  # A script in its own process, outside the one test-runner invocation: a long test heap puts
  # full-GC pauses inside timing windows. One cell only, ubuntu + 3.14, to keep it from
  # flaking across runners. It needs no packages.
  hook-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Hook latency budget
        working-directory: pact-plugin
        run: python tests/perf/hook_latency.py

  # `claude plugin validate` reads manifests only and needs no login or API key (checked with
  # an empty HOME and no credentials). The CLI version is pinned; --strict turns warnings into
  # failures, as the release gate does.
  plugin-validate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: "2.1.302"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate --strict pact-plugin
          claude plugin validate --strict .

  # A stranger's first install, scripted (dev/clean-room/run.sh; its header lists the steps). The
  # script copies this checkout to a scratch directory and re-runs itself under `env -i`, so the
  # runner's HOME, settings and tools on PATH do not reach the check. Python 3.9 is the declared
  # floor; the CLI version is pinned to the one plugin-validate uses, and --expect-cli fails the
  # job if the install resolved anything else. A step failure prints its log tail.
  clean-room:
    name: clean-room on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CLAUDE_CODE_VERSION: "2.1.302"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Install the Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Clean-room check
        run: bash dev/clean-room/run.sh --expect-cli "$CLAUDE_CODE_VERSION" .
