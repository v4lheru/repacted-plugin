<text x="223" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">SPECIALIST</text>
<rect x="158" y="34" width="130" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="223.0" y="59.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">Teachback</text>
<text x="223.0" y="76.0" text-anchor="middle" font-size="11" fill="#9198a1">says the brief</text>
<text x="223.0" y="91.0" text-anchor="middle" font-size="11" fill="#9198a1">back first</text>
<path d="M288 70.0H314" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
<text x="381" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">SPECIALIST</text>
<rect x="316" y="34" width="130" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="381.0" y="59.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">Build</text>
<text x="381.0" y="76.0" text-anchor="middle" font-size="11" fill="#9198a1">own worktree,</text>
<text x="381.0" y="91.0" text-anchor="middle" font-size="11" fill="#9198a1">red, then green</text>
<path d="M446 70.0H472" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
<text x="539" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">SPECIALIST</text>
<rect x="474" y="34" width="130" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="539.0" y="59.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">HANDOFF</text>
<text x="539.0" y="76.0" text-anchor="middle" font-size="11" fill="#9198a1">what changed</text>
<text x="539.0" y="91.0" text-anchor="middle" font-size="11" fill="#9198a1">and what is open</text>
<path d="M604 70.0H630" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
<text x="697" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">CHECK</text>
<rect x="632" y="34" width="130" height="72" rx="8" fill="#0f2a19" stroke="#3fb950" stroke-width="1.2"/>
<text x="697.0" y="59.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">Evidence</text>
<text x="697.0" y="76.0" text-anchor="middle" font-size="11" fill="#9198a1">passing run of</text>
<text x="697.0" y="91.0" text-anchor="middle" font-size="11" fill="#9198a1">the current files</text>
<path d="M762 70.0H788" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
<text x="855" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">LEAD</text>
<rect x="790" y="34" width="130" height="72" rx="8" fill="#21153a" stroke="#a371f7" stroke-width="1.2"/>
<text x="855.0" y="59.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">Accepted</text>
<text x="855.0" y="76.0" text-anchor="middle" font-size="11" fill="#9198a1">only the lead</text>
<text x="855.0" y="91.0" text-anchor="middle" font-size="11" fill="#9198a1">can close it</text>
<path d="M697 106V146H381V108" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#r)"/>
<text x="539.0" y="166" text-anchor="middle" font-size="11.5" fill="#f85149">rejected: the corrections are written onto the task, not lost in chat</text>
