<svg xmlns="http://www.w3.org/2000/svg" width="920" height="196" viewBox="0 0 920 196" role="img" aria-label="A task's life: dispatch, teachback, build, handoff, evidence check, accepted; a rejection sends corrections back onto the task" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>A task's life: dispatch, teachback, build, handoff, evidence check, accepted; a rejection sends corrections back onto the task</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs>

<text x="65" y="22" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.2" fill="#9198a1">LEAD</text>
<rect x="0" y="34" width="130" height="72" rx="8" fill="#21153a" stroke="#a371f7" stroke-width="1.2"/>
